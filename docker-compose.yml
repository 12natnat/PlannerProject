version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pdits-mysql-dev
    environment:
      MYSQL_DATABASE: planner_project
      MYSQL_USER: pdits
      MYSQL_PASSWORD: devpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - pdits-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pdits-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - pdits-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  pdits-network:
    driver: bridge
